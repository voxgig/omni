# CI for omni.
#
# One job per port, so a single failing language is named in the UI rather
# than buried in a 23-language log. `fail-fast: false` because the whole
# point of a shared spec is knowing *which* ports disagree with it.
#
# Toolchains are pinned to a major version rather than floating: a port
# breaking because a compiler moved is worth a deliberate bump, not a
# mystery red build.
#
# Two extra jobs guard the properties that make the ports one library:
# `parity` checks every port exposes the same canonical API, and
# `struct-compat` checks omni can still stand in for voxgig/struct's own
# runner.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # struct-compat runs voxgig/struct's own JavaScript suite against omni's
  # runner, so it checks that repo out. Pinned to a SHA rather than floating
  # on struct's default branch: unpinned, a red run has three possible causes
  # - omni regressed, struct's library regressed, or struct's tests moved -
  # and only the first is actionable here. Pinning leaves just that one.
  # Bump this line to gate against a newer struct. (Register item 0.5.)
  STRUCT_REF: 9386f9de38eb6901f17994e7c0089443c3e656f3

jobs:
  # Ports whose toolchain ships with ubuntu-latest, or installs in one
  # apt line. Grouped so 23 languages do not mean 23 near-identical blocks.
  preinstalled:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: perl, apt: '' }
          - { lang: c, apt: '' }
          - { lang: cpp, apt: '' }
          - { lang: lua, apt: lua5.4 }
          - { lang: php, apt: php-cli }
          # No opam file to resolve - the port builds with plain ocamlc,
          # and Ubuntu's 4.14 is the version it targets.
          - { lang: ocaml, apt: ocaml-nox }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        if: matrix.apt != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}
      - run: make test-${{ matrix.lang }}

  node:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make test-${{ matrix.lang }}

  jvm:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [java, kotlin, scala]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: coursier/setup-action@9b7939bf01fd1185ce2babe16135168361bf2c62 # v3
        if: matrix.lang == 'scala'
        with:
          apps: scala scalac scala-cli
      # Not via coursier: it has no `kotlinc` app in either channel, which
      # is what the second CI run failed on. The official release zip is
      # version-pinned and needs nothing else.
      - name: Install Kotlin
        if: matrix.lang == 'kotlin'
        env:
          KOTLIN_VERSION: '2.1.20'
          KOTLIN_SHA256: 'a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a'
        run: |
          # --retry, because GitHub's release CDN returns the occasional 500
          # and curl retries 5xx as transient. Without it a healthy toolchain
          # reads as a broken port.
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          echo "$KOTLIN_SHA256  /tmp/kotlin.zip" | sha256sum -c -
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - run: make test-${{ matrix.lang }}

  # Its own job, not part of the jvm matrix: a matrix resolves every action
  # it references whether or not `if:` would skip it, so a bad reference
  # here would take java, kotlin and scala down with it.
  clojure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # NOTE: this action tags releases without a `v` prefix - `@13`, not
      # `@v13`, which is what the first run failed on.
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13
        with:
          cli: latest
      - run: make test-clojure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: make test-python

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - run: make test-ruby

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22'
      - run: make test-go

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - run: make test-rust

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0'
      - run: make test-csharp

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Downloaded straight from ziglang.org rather than via setup-zig.
      # 0.16.0 is a real tagged release, but that action tries community
      # mirrors first and then falls back to ziglang.org/builds, which only
      # serves dev builds - so a tagged version 404s there once the mirrors
      # are flaky, as they were. A pinned tarball with a checked hash has
      # neither failure mode.
      - name: Install Zig
        env:
          ZIG_VERSION: '0.16.0'
          ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
        run: |
          url="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/zig.tar.xz "$url"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - run: make test-zig

  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SwiftyLab rather than swift-actions/setup-swift: the latter targets
      # Node 20 at every published version including its v3 pre-release, and
      # Node 20 actions are refused. Same `swift-version` input.
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '5.10'
      - run: make test-swift

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - run: make test-dart

  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - run: make test-elixir

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: '9.6'
      - run: make test-haskell

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # elan directly rather than lean-action: with its build and test steps
      # disabled, lean-action installs elan but never configures a default
      # toolchain, so lake had no lean to run. The version comes from
      # lean/lean-toolchain, so CI and a developer machine agree.
      - name: Install Lean
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/elan-init.sh https://elan.lean-lang.org/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make test-lean

  # spec/*.json is generated from spec/*.aontu and committed so that no port
  # needs a Node toolchain. Recompile it here and fail if the committed copy
  # differs — a spec edit cannot land with a stale artifact.
  spec-freshness:
    name: spec regenerates from *.aontu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make spec
      # Not `git diff --exit-code`: that ignores untracked files, so a commit
      # adding a new spec/*.aontu without its generated JSON would pass while
      # the artifact the ports read was never committed at all.
      - name: Fail if a committed spec JSON is stale or missing
        run: |
          if [ -n "$(git status --porcelain -- spec/)" ]; then
            git status --porcelain -- spec/
            echo
            echo "spec/ is out of sync with its .aontu sources."
            echo "Run 'make spec' and commit the result."
            exit 1
          fi
      # A well-formed spec, not just a fresh artifact: unify each spec
      # source with the format shape (spec/def/omni-spec.aontu), which is
      # itself aontu. --self-test proves the shape can still go red.
      - name: Check spec sources against the format shape
        run: cd tools && npm run --silent check-spec-shape

  # The two properties that make 23 ports one library rather than 23
  # lookalikes.
  parity:
    name: api parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: make parity

  pack-check:
    name: npm packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      # What @voxgig/omni and @voxgig/omni-js would publish, installed from
      # a tarball into an empty directory and used. The port suites cannot
      # see this: they run against the working tree.
      - run: make pack-check

  struct-compat:
    name: struct compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out voxgig/struct
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/struct
          path: .struct
          ref: ${{ env.STRUCT_REF }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make struct-compat STRUCT=${{ github.workspace }}/.struct
