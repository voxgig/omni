# Prose gate. Runs over the reader-facing pages in CI; see
# .github/workflows/docs.yml and STYLE-GUIDE.md.
#
# Precedence, decided deliberately and recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason and the count it
# produced on a clean run, so a reader who wonders why a Google rule is
# off finds the answer here rather than guessing it is an oversight.
#
# CARRIED FROM voxgig/struct, and through it from jostraca/jostraca, which
# share an author and a house voice with this repository. The structure
# and the reasoning are those projects'; the levels are not, because every
# one of them was re-measured against these pages. A level copied without
# measuring is a level nobody can defend later.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Omni
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever the
# package registry serves at sync time, so a Google release could add or
# change an error-level rule and turn an unrelated docs pull request red --
# exactly the nondeterminism pinning the BINARY was supposed to prevent.
# Pinning one without the other prevented half of it.
#
# v0.7.1 is the release every count in this file was measured against.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, Omni

# WHAT THE GATE READS. The reader-facing set is printed by
# `python3 tools/check_prose.py --files` -- 26 pages when this file was
# written -- and the CI invocation names them rather than passing a
# directory, so that the Vale gate and the check_prose gate cannot read
# different sets.
#
# Working documents are NOT in that set: the agent instruction files,
# plans, reviews and decision records are written for the people changing
# this repository, and the voice rules do not apply to them. The sections
# at the bottom of this file switch every style off for the directories
# that hold them, as a safety net against a bare `vale .`.
#
# Documentation must not CITE the working documents either. A link out of
# a page into a plan or an agent instruction file strands the reader in
# material written for somebody else and revised on somebody else's
# schedule. That rule is tools/check_prose.py `internal-documents`, not a
# Vale rule, because Vale cannot tell a working document from a page.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These rules encode Google's house style, not correctness, and each one
# would flatten a voice choice the guide makes on purpose.

# THE EM DASH IS SPACED HERE. Google rules it unspaced, and jostraca
# follows Google. The Voxgig repositories do not, and the divergence is a
# convention rather than drift: 24 spaced dashes across the
# reader-facing pages when this line was written, and the rule produced
# 13 hits on a clean run, every one of them the house
# spacing. Rewriting them to satisfy a rule the prose has never once
# broken would be the tail wagging the dog.
#
# The convention is still enforced, just not by this rule:
# tools/check_prose.py `em-dashes-are-spaced` fails an unspaced dash, and
# `em-dashes-are-rationed` carries the one-aside-per-line ration that
# Google has no rule for at all.
Google.EmDash = NO

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in the tutorial", so the rule is off here and the restriction is
# carried by tools/check_prose.py `we-appears-only-in-tutorials`, which
# knows which pages are tutorials. 0 hits on a clean run.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. tools/check_prose.py `first-person-singular` covers it,
# including `my` and `mine`; this rule also fires on "me" inside quoted
# output, so it is off here. 0 hits on a clean run.
#
# Upstream records that both of these lines were once there claiming an
# enforcement that did not exist, and that writing the tests found live
# violations both gates had been blind to. The named checks exist here for
# that reason: switching a Google rule off in favour of a house rule means
# the house rule has to be real.
Google.FirstPerson = NO

# THE VOCABULARY IS NOT A CASING RULE. `Vale.Terms` reads every entry in
# accept.txt as a canonical spelling and demands the docs match its
# casing, which turns a file whose whole job is to widen the spelling
# dictionary into a rule that narrows it -- voxgig/struct measured 445
# alerts from it, every one false. accept.txt still brackets the casings
# that occur both ways, so the file is accurate about what it accepts
# whether or not this rule is on.
Vale.Terms = NO

# US convention: commas and periods INSIDE the quotation marks. The house
# voice is not US English, and putting a period inside a quoted `code
# span` is actively wrong when the quote is a literal.
# 3 hits.
Google.Quotes = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its subject
# on the thing being documented ("the value is overwritten").
# 76 hits, almost all of them fine. Advisory only, never
# a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. 62 hits,
# none of them defects. Advisory only.
Google.Contractions = suggestion

# --- The gate ----------------------------------------------------------
#
# Everything below is error-level and fails CI. These are the rules that
# carry no voice cost: conventions a reader benefits from and an author
# has no reason to vary.
Vale.Spelling = error
Google.Spelling = error
Google.OxfordComma = error
Google.Spacing = error
Google.Anthropomorphism = error
Google.ExcessiveClaims = error
Google.Ellipses = error
Omni.WordChoice = error

# --- Demoted on evidence, not on taste --------------------------------
#
# Each of these was run at error level against the real pages first. They
# are warnings because they were WRONG here, not because they were
# inconvenient; the count is what each produced on a clean run.

# "Use parentheses judiciously" is advice, not a rule, and the house guide
# already rations them more precisely than this can (voice rule 4:
# definitions, caveats, and at most one dry aside per page).
# 31 hits, and the reference tables that produce most of
# them are parenthesising types and defaults.
Google.Parens = warning

# Semicolons in a reference sentence that lists conditions are doing the
# job a comma cannot. 34 hits and no defect among the
# ones read.
Google.Semicolons = warning

# Wants JSON, CLI, API, HTTP and the rest spelled out on first use. The
# audience is developers; padding the prose with "application programming
# interface" would serve nobody. 18 hits, all of them
# standard terms for this reader.
Google.Acronyms = warning

# Maps `touch` to `tap`, a mobile-UI rule, and objects to casings this
# project states deliberately (`snake_case`, `camelCase`, identifiers).
# 32 hits. The three substitutions from this rule
# that do hold are carried at error level by Omni.WordChoice.
Google.WordListCase = warning

# Flags a heading that names a proper noun or a code identifier as not
# sentence case. The rule cannot know that a product or a function name
# keeps its casing. 34 hits, sampled and found false.
Google.Headings = warning

# Wants "for example" for `e.g.` and "that is" for `i.e.`.
# 0 hits, and the ones read are inside parentheses or
# table cells in reference material, where the two-letter form is what
# keeps a cell to one line. Prose outside a parenthesis should still say
# "for example"; that is a review matter, not a gate.
Google.Latin = warning

# Objects to "camelCase" and similar as jargon. They are the names of
# conventions this project has to talk about. 0 hits.
Google.Jargon = warning

# Wants "command-line tool" for CLI and similar. 1 hit,
# on pages about command-line tools whose own documentation calls them a
# CLI.
Google.WordList = warning

# Flags an `-ly` adverb before a hyphen ("newly-created"), a real error
# class -- but it cannot tell an adverb from a word that merely ends in
# those two letters (`supply-chain`). 0 hits. Left at
# warning because the false positive is the structural one and will
# recur.
Google.LyHyphens = warning

# "Will" is often the right tense for what a build does after you run it.
# 0 hits.
Google.Will = warning

# --- The working documents -------------------------------------------
#
# EMPTY, not the word NONE. `BasedOnStyles = NONE` is a runtime error --
# "style 'NONE' does not exist on StylesPath" -- which takes the whole run
# down rather than skipping a directory. An empty value is the form that
# works.
#
# A SECTION THAT COVERS A PAGE SILENCES IT. Vale matches these globs
# against every file it is given, named on the command line or not, so a
# blanked section over a directory that also holds a reader-facing page
# switches every rule off for that page and reports nothing -- the silent
# hole the explicit file list was meant to rule out. voxgig/model's first
# draft of this file had it: `[go/**]` blanked go/README.md, and Vale
# passed the page without reading it. tools/check_prose.py
# `vale-sections-spare-the-pages` fails on any blanked section that
# matches a page; keep the globs to directories that hold no page. The
# sections are what stops a bare `vale .` from reporting on material no
# one intended it to read.
#
# The port directories are not listed: the gate reads each port's
# README.md by name, and nothing else in a port directory is a page.
[doc/**]
BasedOnStyles =

[spec/**]
BasedOnStyles =

[tools/**]
BasedOnStyles =
